# native-image 的构建参数（放在项目的标准位置，构建时自动生效）。
# 这些是「让 JavaFX 在原生镜像里能跑起来」的最小必需项，与本复现的目标无关。
Args = --emit build-report \
       --no-fallback \
       --initialize-at-run-time=com.sun.javafx.application.PlatformImpl,com.sun.javafx.application.LauncherImpl,com.sun.javafx.logging.PlatformLogger,com.sun.javafx.util.Utils,com.sun.javafx.font,com.sun.glass.ui,com.sun.glass.utils.NativeLibLoader,com.sun.prism,com.sun.scenario.animation,com.sun.javafx.text,com.sun.javafx.scene.text
